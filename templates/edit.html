{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Edit Mahasiswa</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('edit_student', id=student.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="nim">NIM</label>
                        <input type="text" name="nim" id="nim" class="form-control" value="{{ student.nim }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="nama">Nama Lengkap</label>
                        <input type="text" name="nama" id="nama" class="form-control" value="{{ student.nama }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="jurusan">Jurusan</label>
                        <input type="text" name="jurusan" id="jurusan" class="form-control" value="{{ student.jurusan }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" name="email" id="email" class="form-control" value="{{ student.email }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Batal</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
